# race_route.yaml
waypoints:
    # 途经点1: 起点/第一个弯道
    - frame: map
      x: 1.49987      # 你日志里的第一个目标点X
      y: 0.743541      # 你日志里的第一个目标点Y
      yaw: 1.99759    # 你日志里的第一个目标点角度(弧度)

    # 途经点2: 赛道拐角
    - frame: map
      x: 1.27954
      y: 1.31652
      yaw: -2.74095    # 朝向反方向，假设是掉头弯

    # 途经点3: 终点
    - frame: map
      x: 0.627037
      y: 1.07377
      yaw: 1.83089